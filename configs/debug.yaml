model:
  name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  device: cuda
  trust_remote_code: false

data:
  task: multiple_choice
  construction_path: examples/construction.jsonl
  test_path: examples/test.jsonl
  construction_limit: 4
  test_limit: 3

seed_bank:
  sigmas: [0.0005, 0.001]
  seeds_per_sigma: 5
  global_seed: 42

perturbation:
  scale_mode: absolute
  include: null
  exclude: null
  verify_restore: true

generation:
  profile:
    max_new_tokens: 32
    temperature: 0.0
    top_p: 1.0
    batch_size: 2
    max_input_tokens: 512
  eval:
    max_new_tokens: 32
    temperature: 0.0
    top_p: 1.0
    batch_size: 2
    max_input_tokens: 1024
  base:
    max_new_tokens: 32
    temperature: 0.7
    top_p: 0.95
    batch_size: 2
    max_input_tokens: 1024
  judge:
    max_new_tokens: 32
    temperature: 0.0
    top_p: 1.0
    batch_size: 2
    max_input_tokens: 1024

debate:
  rounds: 1
  peer_max_chars: 256
  prompt: verify
  global_seed: 42
