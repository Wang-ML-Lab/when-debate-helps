model:
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  device: cuda
  trust_remote_code: false

data:
  task: multiple_choice
  construction_path: data/benchmark/train.jsonl
  test_path: data/benchmark/test.jsonl
  construction_limit: null
  test_limit: null

seed_bank:
  sigmas: [0.0005, 0.001, 0.002]
  # Regenerated reference pool matching the camera-ready per-scale counts.
  counts_per_sigma: [160, 174, 166]
  global_seed: 42

perturbation:
  scale_mode: absolute
  include: null
  exclude: null
  verify_restore: true

generation:
  # AMC12/MATH500 camera-ready budget. Override relevant blocks to 4096 for
  # GPQA and MMLU-Redux as documented in README.md.
  profile:
    max_new_tokens: 8192
    temperature: 0.0
    top_p: 1.0
    batch_size: 8
    max_input_tokens: 8192
  eval:
    max_new_tokens: 8192
    temperature: 0.0
    top_p: 1.0
    batch_size: 8
    max_input_tokens: 16384
  base:
    max_new_tokens: 8192
    temperature: 0.7
    top_p: 0.95
    batch_size: 8
    max_input_tokens: 16384
  judge:
    max_new_tokens: 8192
    temperature: 0.0
    top_p: 1.0
    batch_size: 8
    max_input_tokens: 16384

debate:
  rounds: 3
  peer_max_chars: 800
  prompt: verify
  global_seed: 42
